# Ground truth for the evaluation harness (`python main.py --eval`).
# Files are processed in this order on a fresh database, the way they would
# arrive in an AP inbox, so duplicate/revision/split detection is exercised.
#
#   pay       : must this invoice be paid? (the question that costs money)
#   status    : acceptable final statuses. With an LLM, REJECT vs ESCALATE can
#               legitimately differ for borderline cases; paying never can.
#   offline   : the exact status the deterministic rules must produce (tests
#               pin this so a rules change can't silently shift outcomes)
#   must_flag : finding codes that must be raised (recall of known issues)
#   why       : the trap, in one line

data/invoices/invoice_1001.txt:
  {pay: true, status: [PAID], must_flag: [], why: "Clean baseline"}
data/invoices/invoice_1002.txt:
  {offline: ESCALATED, pay: false, status: [ESCALATED, REJECTED], must_flag: [STOCK_EXCEEDED], why: "Typos everywhere; bills 20 GadgetX, 5 in stock"}
data/invoices/invoice_1003.txt:
  {pay: false, status: [REJECTED], must_flag: [ZERO_STOCK_ITEM, FRAUD_RISK_HIGH, UNPARSEABLE_DUE_DATE, UNKNOWN_VENDOR], why: "Fraud: FakeItem, 'due yesterday', wire-transfer pressure"}
data/invoices/invoice_1004.json:
  {pay: true, status: [PAID], must_flag: [], why: "Clean JSON with tax"}
data/invoices/invoice_1004_revised.json:
