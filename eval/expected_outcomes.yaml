data/invoices/invoice_1009.json:
  {pay: false, status: [REJECTED], must_flag: [NEGATIVE_QUANTITY, MISSING_VENDOR, NON_POSITIVE_TOTAL], why: "Negative quantity, blank vendor, negative total"}
data/invoices/invoice_1010.txt:
