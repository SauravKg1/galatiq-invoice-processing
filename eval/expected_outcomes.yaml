data/invoices/invoice_1005.json:
  {offline: ESCALATED, pay: false, status: [ESCALATED, REJECTED], must_flag: [STOCK_EXCEEDED, UNKNOWN_VENDOR], why: "Over $10K, 8 GadgetX vs 5, unknown vendor at 1600 Pennsylvania Ave"}
data/invoices/invoice_1006.csv:
